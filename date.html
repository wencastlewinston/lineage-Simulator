<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 關鍵修正 1：加入這行，讓網頁在手機上以 1:1 正常大小顯示，不再變電腦版 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年 3人週末自選排班系統 (精準對齊版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; padding: 15px; margin: 0; color: #333; }
        
        /* 關鍵修正 2：將 max-width 改為更適合手機的寬度，並讓 padding 在小螢幕時縮小 */
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a365d; font-size: 20px; margin-bottom: 20px; }
        .control-panel { display: flex; justify-content: center; margin-bottom: 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .header { background: #2b6cb0; color: white; padding: 10px 0; font-weight: bold; border-radius: 4px; font-size: 13px; }
        
        /* 關鍵修正 3：防止下拉選單把卡片撐爆，優化文字大小與間距 */
        .card { border: 1px solid #e2e8f0; padding: 12px 4px; border-radius: 6px; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 75px; box-sizing: border-box; }
        .thu { border-top: 4px solid #805ad5; background-color: #faf5ff; } 
        .fri { border-top: 4px solid #dd6b20; background-color: #fffaf0; } 
        .sun { border-top: 4px solid #3182ce; background-color: #ebf8ff; } 
        .date-num { font-weight: bold; font-size: 13px; margin-bottom: 6px; color: #4a5568; }
        
        /* 關鍵修正 4：縮小手機版字體，並允許在空間不夠時自動換行，避免文字溢出卡片 */
        .staff-on { font-size: 13px; font-weight: bold; color: #2d3748; word-break: break-all; }
        .lock-text { font-size: 13px; font-weight: bold; color: #e53e3e; word-break: break-all; }
        
        select { width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #cbd5e0; background: white; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 2026年 週末排班系統</h1>
    <div class="control-panel">
        <select id="month-select" onchange="render()"></select>
    </div>
    <div id="grid" class="grid"></div>
</div>

<script>
    const staff = ["冠妏", "俊傑", "雲勇"];
    let data = JSON.parse(localStorage.getItem('sc2026_final')) || {};

    const select = document.getElementById('month-select');
    const currentYear = new Date().getFullYear();
    const currentMonth = new Date().getMonth() + 1;
    
    for(let i=1; i<=12; i++) {
        let opt = document.createElement('option');
        opt.value = i; opt.text = i + ' 月';
        if(currentYear === 2026 && i === currentMonth) {
            opt.selected = true;
        } else if (currentYear !== 2026 && i === 1) {
            opt.selected = true;
        }
        select.appendChild(opt);
    }

    function render() {
        const m = parseInt(select.value) - 1;
        const grid = document.getElementById('grid');
        grid.innerHTML = '<div class="header">星期四</div><div class="header">星期五</div><div class="header">星期日</div>';
        
        let d = new Date(2026, m, 1);
        while(d.getDay() !== 4) {
            d.setDate(d.getDate() - 1);
        }
        
        while(true) {
            let thu = new Date(d);
            let fri = new Date(d); fri.setDate(fri.getDate() + 1);
            let sun = new Date(d); sun.setDate(sun.getDate() + 3);
            
            if (thu.getMonth() !== m && fri.getMonth() !== m && sun.getMonth() !== m) {
                if (thu.getMonth() > m || (thu.getFullYear() > 2026)) break;
                d.setDate(d.getDate() + 7);
                continue;
            }

            let key = thu.toISOString().split('T')[0];

            if (!data[key]) data[key] = {};
            if (!data[key].thu) data[key].thu = "全體";
            if (!data[key].fri) data[key].fri = "排班";

            if(data[key].thu !== "全體") {
                data[key].fri = "全體休假";
            }

            buildThuCard(thu, key);
            buildFriCard(fri, key);
            buildSunCard(sun, key);

            d.setDate(d.getDate() + 7);
        }
    }

    function buildThuCard(date, key) {
        let div = document.createElement('div');
        div.className = 'card thu';
        div.innerHTML = `<div class="date-num">${date.getMonth()+1}/${date.getDate()}</div>`;
        
        let s = document.createElement('select');
        let options = ["全體", ...staff];
        s.innerHTML = options.map(n => `<option value="${n}" ${data[key].thu==n?'selected':''}>${n}</option>`).join('');
        
        s.onchange = (e) => {
            data[key].thu = e.target.value;
            if(e.target.value === "全體") {
                data[key].fri = "排班";
            }
            saveAndRefresh();
        };
        div.appendChild(s);
        grid.appendChild(div);
    }

    function buildFriCard(date, key) {
        let div = document.createElement('div');
        div.className = 'card fri';
        div.innerHTML = `<div class="date-num">${date.getMonth()+1}/${date.getDate()}</div>`;
        
        if(data[key].thu !== "全體") {
            div.innerHTML += `<div class="lock-text">全體休假</div>`;
        } else {
            let s = document.createElement('select');
            let options = ["排班", ...staff];
            s.innerHTML = options.map(n => `<option value="${n}" ${data[key].fri==n?'selected':''}>${n}</option>`).join('');
            
            s.onchange = (e) => {
                data[key].fri = e.target.value;
                saveAndRefresh();
            };
            div.appendChild(s);
        }
        grid.appendChild(div);
    }

    function buildSunCard(date, key) {
        let div = document.createElement('div');
        div.className = 'card sun';
        div.innerHTML = `<div class="date-num">${date.getMonth()+1}/${date.getDate()}</div>`;
        
        let displayTarget = "待定";
        
        if(data[key].thu !== "全體") {
            let offStaff = data[key].thu;
            displayTarget = staff.filter(n => n !== offStaff).join('、');
        } 
        else {
            let friChoice = data[key].fri;
            if(friChoice !== "排班") {
                displayTarget = staff.filter(n => n !== friChoice).join('、');
            }
        }
        
        div.innerHTML += `<div class="staff-on">${displayTarget}</div>`;
        grid.appendChild(div);
    }

    function saveAndRefresh() {
        localStorage.setItem('sc2026_final', JSON.stringify(data));
        render();
    }

    render();
</script>
</body>
</html>
